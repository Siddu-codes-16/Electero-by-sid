<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Electero - Electronics Design Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="logo">
                <span class="logo-icon">🔌</span>
                <div>
                    <h1>Electero</h1>
                    <p class="logo-tagline">Electronics Design Assistant</p>
                </div>
            </a>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/led">LED Calculator</a></li>
                    <li><a href="/voltage-divider">Voltage Divider</a></li>
                    <li><a href="/color-code">Color Code</a></li>
                    <li><a href="/filter">Filter Designer</a></li>
                    <li><a href="/history">History</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Built with ❤️ for electronics enthusiasts | Electero &copy; 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
