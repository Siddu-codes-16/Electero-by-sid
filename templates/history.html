{% extends "base.html" %}

{% block title %}Calculation History - Electero{% endblock %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 class="card-title" style="margin: 0;">📜 Calculation History</h2>
        <button id="clear-history-btn" class="btn btn-danger">Clear All</button>
    </div>

    <div id="history-container">
        <div class="spinner"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadHistory() {
    const container = document.getElementById('history-container');

    try {
        const response = await fetch('/api/history');
        const history = await response.json();

        if (history.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                    <p style="font-size: 1.2rem;">📭 No calculations yet</p>
                    <p style="margin-top: 10px;">Start by using one of the calculators!</p>
                </div>
            `;
            return;
        }

        let html = '<table class="history-table"><thead><tr>';
        html += '<th>Date</th>';
        html += '<th>Calculator</th>';
        html += '<th>Inputs</th>';
        html += '<th>Results</th>';
        html += '<th>Action</th>';
        html += '</tr></thead><tbody>';

        history.forEach(item => {
            const date = new Date(item.timestamp).toLocaleString();

            // Format inputs
            let inputStr = Object.entries(item.inputs)
                .filter(([k, v]) => v !== null && v !== '')
                .map(([k, v]) => `${k}: ${v}`)
                .join(', ');

            // Format results (show first 3 key results)
            let resultStr = Object.entries(item.results)
                .filter(([k, v]) => !k.includes('frequencies') && !k.includes('magnitude'))
                .slice(0, 3)
                .map(([k, v]) => `${k}: ${v}`)
                .join(', ');

            html += `<tr>
                <td>${date}</td>
                <td><strong>${item.calc_type}</strong></td>
                <td style="font-size: 0.9rem; color: var(--text-secondary);">${inputStr}</td>
                <td style="font-size: 0.9rem; color: var(--text-secondary);">${resultStr}</td>
                <td>
                    <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.9rem;"
                            onclick="deleteCalculation(${item.id})">Delete</button>
                </td>
            </tr>`;
        });

        html += '</tbody></table>';
        container.innerHTML = html;

    } catch (error) {
        container.innerHTML = `
            <div class="alert alert-error">
                Failed to load history: ${error.message}
            </div>
        `;
    }
}

async function deleteCalculation(id) {
    if (!confirm('Delete this calculation?')) return;

    try {
        await fetch(`/api/history/${id}`, { method: 'DELETE' });
        loadHistory();
    } catch (error) {
        alert('Failed to delete: ' + error.message);
    }
}

document.getElementById('clear-history-btn').addEventListener('click', async () => {
    if (!confirm('Clear all calculation history? This cannot be undone.')) return;

    try {
        await fetch('/api/history/clear', { method: 'POST' });
        loadHistory();
    } catch (error) {
        alert('Failed to clear history: ' + error.message);
    }
});

// Load history on page load
loadHistory();
</script>
{% endblock %}
